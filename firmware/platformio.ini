; Smart GrowKit — ESP32-WROOM DevKit (esp32dev, CP2102 USB-C)
; SoftAP GrowKit-PoC + local schedules. No MQTT. Heater off while SGK_HEATER_ENABLED=0.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
lib_deps =
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    adafruit/MAX6675 library
build_flags =
    -D SGK_FW_VERSION=\"0.6.1-poc\"
    -D SGK_DEVICE_ID=\"sgk-proto-001\"
    -D SGK_HEATER_ENABLED=0
    -D SGK_BENCH_SIM=0
    ; GPIO12 and GPIO15 stay unused (ESP32 strap pins).
    ; SGK_BENCH_SIM=1: NAN sensors use last POST /sim values (RAM). Default level_pct=80.
